name: Sonar Analysis

on:
  push:
    branches:
      - main
      - 'feat/**'

jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sqs-dce-shichao.ngrok.io
        with:
          args: >
            -Dsonar.projectKey=rand-test-repos_NodeGoat
